name: New device
description: Add a device to PenWare's catalog (firmware watch, install steps, backup).
title: "New device: "
labels: ["new device"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in what you know. Official sources only. Anything left blank can be filled in later.
  - type: input
    id: name
    attributes:
      label: Device name
      placeholder: "e.g. Marauder V8"
    validations:
      required: true
  - type: textarea
    id: blurb
    attributes:
      label: One-line description
      placeholder: "e.g. ESP32 Marauder v8 (ESP32-C5). Stable release plus nightly."
  - type: input
    id: repo
    attributes:
      label: Official firmware GitHub repo
      description: The repo whose Releases page has the firmware. If firmware is not on GitHub, paste the official download page instead.
      placeholder: "https://github.com/owner/repo"
    validations:
      required: true
  - type: input
    id: asset
    attributes:
      label: File name pattern for this exact board
      description: A piece of the release file name that only matches your board. Leave blank if there is one file for everyone.
      placeholder: "e.g. _v8.bin"
  - type: checkboxes
    id: channels
    attributes:
      label: Channels to watch
      options:
        - label: Stable releases
        - label: Pre-releases / nightlies
  - type: dropdown
    id: backup
    attributes:
      label: Chip / backup type
      options:
        - ESP32 family (USB backup supported)
        - Other (backup checklist)
        - Not sure
  - type: input
    id: chips
    attributes:
      label: Chip(s), if ESP32
      placeholder: "e.g. ESP32-S3, or ESP32-C5 + ESP32 WROOM"
  - type: textarea
    id: links
    attributes:
      label: Official links
      description: Docs, web flasher, update guide. One per line.
  - type: textarea
    id: install
    attributes:
      label: How you install updates
      description: Steps in your own words. They will be tidied up for the device page.
  - type: textarea
    id: recovery
    attributes:
      label: Recovery if an update goes wrong
      description: Download / DFU mode button combo, recovery tool. Leave blank if unknown.
